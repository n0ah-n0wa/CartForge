# CartForge continuous delivery
#
# Chain: successful CI → Publish Image → this workflow
# Flow: Helm lint → Helm template → deploy → wait for rollout → verify
#
# Deploys the immutable image tag ghcr.io/<owner>/ecommerce-api:<git-sha>.
# Application secrets stay in the cluster (existing Secret). Cluster access
# credentials stay in GitHub Actions secrets / environment secrets.
# See docs/deployment.md for required configuration.

name: CD

on:
  workflow_run:
    workflows:
      - Publish Image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full git SHA of the published image to deploy
        required: true
        type: string

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v3.16.4
  IMAGE_NAME: ecommerce-api
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Helm deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Environment-scoped secrets/variables. Create a GitHub Environment named
    # "production" and attach KUBE_CONFIG (and optional vars) there.
    environment: production

    permissions:
      contents: read
      actions: read

    steps:
      - name: Resolve deployment revision
        id: rev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHA="${{ inputs.git_sha }}"
            if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Refusing to deploy: expected a full 40-character git SHA, got '${SHA}'" >&2
              exit 1
            fi
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Publish Image" \
              --commit "${SHA}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -z "${RUN_ID}" ]]; then
              echo "Refusing to deploy: no successful Publish Image run found for ${SHA}" >&2
              exit 1
            fi
            echo "Verified Publish Image run ${RUN_ID} for ${SHA}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}"
          RELEASE="${{ vars.HELM_RELEASE_NAME }}"
          NAMESPACE="${{ vars.KUBE_NAMESPACE }}"
          APP_SECRET="${{ vars.APP_SECRET_NAME }}"

          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "release=${RELEASE:-cartforge}" >> "${GITHUB_OUTPUT}"
          echo "namespace=${NAMESPACE:-cartforge}" >> "${GITHUB_OUTPUT}"
          echo "app_secret=${APP_SECRET:-cartforge-secrets}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${IMAGE}:${SHA}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
          fetch-depth: 1

      - name: Require cluster credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBE_CONFIG}" ]]; then
            echo "Missing secret KUBE_CONFIG in the 'production' GitHub Environment." >&2
            echo "See docs/deployment.md for required GitHub and Kubernetes configuration." >&2
            exit 1
          fi

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"
          # Accept raw kubeconfig YAML or base64-encoded kubeconfig.
          if [[ "${KUBE_CONFIG}" == *"apiVersion:"* ]]; then
            printf '%s\n' "${KUBE_CONFIG}" > "${HOME}/.kube/config"
          else
            printf '%s' "${KUBE_CONFIG}" | base64 --decode > "${HOME}/.kube/config"
          fi
          chmod 600 "${HOME}/.kube/config"
          unset KUBE_CONFIG
          kubectl config current-context >/dev/null
          kubectl get --raw='/readyz' >/dev/null

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build Helm value overrides
        id: values
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DATABASE_HOST: ${{ vars.DATABASE_HOST }}
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}
          REDIS_URL: ${{ vars.REDIS_URL }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          INGRESS_HOST: ${{ vars.INGRESS_HOST }}
          IMAGE_PULL_SECRET_NAME: ${{ vars.IMAGE_PULL_SECRET_NAME }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.rev.outputs.image }}"
          SHA="${{ steps.rev.outputs.sha }}"
          APP_SECRET="${{ steps.rev.outputs.app_secret }}"

          HELM_ARGS=(
            --set "image.repository=${IMAGE}"
            --set "image.tag=${SHA}"
            --set "image.pullPolicy=IfNotPresent"
            --set "secrets.create=false"
            --set "secrets.existingSecret=${APP_SECRET}"
          )

          [[ -n "${DATABASE_URL}" ]] && HELM_ARGS+=(--set-string "database.url=${DATABASE_URL}")
          [[ -n "${DATABASE_HOST}" ]] && HELM_ARGS+=(--set-string "database.host=${DATABASE_HOST}")
          [[ -n "${DATABASE_USERNAME}" ]] && HELM_ARGS+=(--set-string "database.username=${DATABASE_USERNAME}")
          [[ -n "${REDIS_URL}" ]] && HELM_ARGS+=(--set-string "redis.url=${REDIS_URL}")
          [[ -n "${REDIS_HOST}" ]] && HELM_ARGS+=(--set-string "redis.host=${REDIS_HOST}")
          [[ -n "${CORS_ORIGINS}" ]] && HELM_ARGS+=(--set-string "config.corsOrigins=${CORS_ORIGINS}")

          if [[ -n "${INGRESS_HOST}" ]]; then
            HELM_ARGS+=(--set-string "ingress.hosts[0].host=${INGRESS_HOST}")
            HELM_ARGS+=(--set-string "ingress.hosts[0].paths[0].path=/api")
            HELM_ARGS+=(--set-string "ingress.hosts[0].paths[0].pathType=Prefix")
          fi
          if [[ -n "${IMAGE_PULL_SECRET_NAME}" ]]; then
            HELM_ARGS+=(--set-json "imagePullSecrets=[{\"name\":\"${IMAGE_PULL_SECRET_NAME}\"}]")
          fi

          printf '%s\0' "${HELM_ARGS[@]}" > /tmp/cd-helm-args

      - name: Helm lint
        run: |
          set -euo pipefail
          helm lint helm/cartforge -f helm/cartforge/values-prod.yaml

      - name: Helm template (immutable image tag)
        run: |
          set -euo pipefail
          RELEASE="${{ steps.rev.outputs.release }}"
          NAMESPACE="${{ steps.rev.outputs.namespace }}"
          IMAGE="${{ steps.rev.outputs.image }}"
          SHA="${{ steps.rev.outputs.sha }}"

          sudo apt-get update
          sudo apt-get install -y python3-yaml

          mapfile -d '' HELM_ARGS < /tmp/cd-helm-args
          helm template "${RELEASE}" helm/cartforge \
            -n "${NAMESPACE}" \
            -f helm/cartforge/values-prod.yaml \
            "${HELM_ARGS[@]}" \
            > /tmp/cartforge-cd.yaml

          test -s /tmp/cartforge-cd.yaml
          grep -F "image: ${IMAGE}:${SHA}" /tmp/cartforge-cd.yaml
          grep -q '^kind: Deployment' /tmp/cartforge-cd.yaml

          # ConfigMaps must not contain credential keys.
          python3 - <<'PY'
          import yaml

          forbidden = {"JWT_SECRET", "DATABASE_PASSWORD", "POSTGRES_PASSWORD"}
          with open("/tmp/cartforge-cd.yaml", encoding="utf-8") as handle:
              docs = [doc for doc in yaml.safe_load_all(handle) if doc]

          for doc in docs:
              if doc.get("kind") != "ConfigMap":
                  continue
              data = doc.get("data") or {}
              leaked = forbidden.intersection(data)
              if leaked:
                  raise SystemExit(f"ConfigMap contains forbidden secret keys: {sorted(leaked)}")
          print(f"template ok: {len(docs)} documents")
          PY

      - name: Deploy with Helm (rolling update)
        run: |
          set -euo pipefail
          RELEASE="${{ steps.rev.outputs.release }}"
          NAMESPACE="${{ steps.rev.outputs.namespace }}"

          mapfile -d '' HELM_ARGS < /tmp/cd-helm-args
          # --atomic rolls back on failure; --wait blocks until ready or timeout.
          # Chart strategy keeps maxUnavailable=0 for safe rolling updates.
          helm upgrade --install "${RELEASE}" helm/cartforge \
            -n "${NAMESPACE}" \
            --create-namespace \
            -f helm/cartforge/values-prod.yaml \
            "${HELM_ARGS[@]}" \
            --atomic \
            --wait \
            --timeout 10m \
            --history-max 5

      - name: Wait for Deployment rollout
        id: rollout
        run: |
          set -euo pipefail
          RELEASE="${{ steps.rev.outputs.release }}"
          NAMESPACE="${{ steps.rev.outputs.namespace }}"

          DEPLOYMENT="$(kubectl get deploy -n "${NAMESPACE}" \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=api" \
            -o jsonpath='{.items[0].metadata.name}')"
          if [[ -z "${DEPLOYMENT}" ]]; then
            echo "Could not resolve API Deployment for release ${RELEASE}" >&2
            kubectl get deploy -n "${NAMESPACE}" -o wide >&2 || true
            exit 1
          fi

          echo "deployment=${DEPLOYMENT}" >> "${GITHUB_OUTPUT}"
          kubectl rollout status "deployment/${DEPLOYMENT}" -n "${NAMESPACE}" --timeout=10m
          kubectl wait --for=condition=available "deployment/${DEPLOYMENT}" -n "${NAMESPACE}" --timeout=5m

      - name: Verify deployment
        id: verify
        run: |
          set -euo pipefail
          RELEASE="${{ steps.rev.outputs.release }}"
          NAMESPACE="${{ steps.rev.outputs.namespace }}"
          IMAGE="${{ steps.rev.outputs.image }}"
          SHA="${{ steps.rev.outputs.sha }}"
          DEPLOYMENT="${{ steps.rollout.outputs.deployment }}"

          SERVICE="$(kubectl get svc -n "${NAMESPACE}" \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=api" \
            -o jsonpath='{.items[0].metadata.name}')"

          READY="$(kubectl get deploy "${DEPLOYMENT}" -n "${NAMESPACE}" -o jsonpath='{.status.readyReplicas}')"
          DESIRED="$(kubectl get deploy "${DEPLOYMENT}" -n "${NAMESPACE}" -o jsonpath='{.status.replicas}')"
          if [[ -z "${READY}" || "${READY}" != "${DESIRED}" || "${READY}" -lt 1 ]]; then
            echo "Deployment not fully ready: ready=${READY} desired=${DESIRED}" >&2
            kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE}" -o wide >&2
            kubectl describe deploy "${DEPLOYMENT}" -n "${NAMESPACE}" >&2
            exit 1
          fi

          RUNNING_IMAGE="$(kubectl get deploy "${DEPLOYMENT}" -n "${NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          if [[ "${RUNNING_IMAGE}" != "${IMAGE}:${SHA}" ]]; then
            echo "Unexpected running image '${RUNNING_IMAGE}', expected '${IMAGE}:${SHA}'" >&2
            exit 1
          fi

          echo "service=${SERVICE}" >> "${GITHUB_OUTPUT}"
          echo "ready=${READY}" >> "${GITHUB_OUTPUT}"
          echo "desired=${DESIRED}" >> "${GITHUB_OUTPUT}"
          kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=api" -o wide

      - name: Post-deployment smoke test
        run: |
          set -euo pipefail
          NAMESPACE="${{ steps.rev.outputs.namespace }}"
          SERVICE="${{ steps.verify.outputs.service }}"
          IMAGE="${{ steps.rev.outputs.image }}"
          SHA="${{ steps.rev.outputs.sha }}"
          RELEASE="${{ steps.rev.outputs.release }}"
          DEPLOYMENT="${{ steps.rollout.outputs.deployment }}"

          chmod +x scripts/ci/smoke-test.sh

          kubectl -n "${NAMESPACE}" port-forward "svc/${SERVICE}" 18080:8080 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          cleanup() { kill "${PF_PID}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # Brief wait for port-forward to bind before smoke checks.
          for _ in $(seq 1 15); do
            if curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:18080/actuator/health/liveness" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if ! SMOKE_TIMEOUT_SECONDS=90 ./scripts/ci/smoke-test.sh "http://127.0.0.1:18080"; then
            echo "Smoke test failed" >&2
            cat /tmp/pf.log >&2 || true
            kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE}" -o wide >&2
            kubectl logs -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=api" --tail=100 >&2 || true
            exit 1
          fi

          {
            echo "## CD deployment verified"
            echo ""
            echo "- Image: \`${IMAGE}:${SHA}\`"
            echo "- Namespace: \`${NAMESPACE}\`"
            echo "- Release: \`${RELEASE}\`"
            echo "- Deployment: \`${DEPLOYMENT}\`"
            echo "- Ready replicas: \`${{ steps.verify.outputs.ready }}/${{ steps.verify.outputs.desired }}\`"
            echo "- Smoke: readiness, health, catalog, auth (DB via readiness; Redis fail-open acceptable)"
          } >> "${GITHUB_STEP_SUMMARY}"
