# CartForge continuous integration
#
# Authoritative Java quality gate: ./mvnw verify
#   compile → unit/integration tests → package → checkstyle → spotbugs
# Infrastructure gates: Docker image build, Helm lint, Helm template

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  HELM_VERSION: v3.16.4
  IMAGE_NAME: cartforge-api

jobs:
  java-verify:
    name: Java verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Confirm toolchain
        run: |
          set -euo pipefail
          java -version
          chmod +x mvnw
          ./mvnw -B -version

      - name: Confirm Docker for Testcontainers
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Compile
        run: ./mvnw -B -DskipTests compile

      - name: Verify (tests, static analysis, package)
        run: ./mvnw -B verify

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/ecommerce-api-*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  packaging:
    name: Container and chart validation
    needs: java-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Verify JAR artifact
        run: |
          set -euo pipefail
          ls -la target/
          test -n "$(ls target/ecommerce-api-*.jar)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm lint
        run: |
          set -euo pipefail
          helm lint helm/cartforge -f helm/cartforge/values-dev.yaml \
            --set-string secrets.postgresPassword='ci-dev-only-postgres-password' \
            --set-string secrets.jwtSecret='ci-dev-only-jwt-secret-32chars-minimum!!' \
            --set-string secrets.redisPassword='ci-dev-only-redis-password'
          # values-prod.yaml leaves image.tag empty on purpose; lint still needs a
          # non-SNAPSHOT tag so the chart's required() guard can be evaluated.
          helm lint helm/cartforge -f helm/cartforge/values-prod.yaml \
            --set image.tag="${{ github.sha }}"

      - name: Helm template validation
        run: |
          set -euo pipefail
          helm template cartforge helm/cartforge -f helm/cartforge/values-dev.yaml \
            --set-string secrets.postgresPassword='ci-dev-only-postgres-password' \
            --set-string secrets.jwtSecret='ci-dev-only-jwt-secret-32chars-minimum!!' \
            --set-string secrets.redisPassword='ci-dev-only-redis-password' \
            > /tmp/cartforge-dev.yaml
          helm template cartforge helm/cartforge -f helm/cartforge/values-prod.yaml \
            --set image.tag="${{ github.sha }}" > /tmp/cartforge-prod.yaml

          # Empty / SNAPSHOT prod tags must fail render (no Chart.AppVersion fallback).
          if helm template cartforge helm/cartforge -f helm/cartforge/values-prod.yaml \
              > /tmp/cartforge-prod-empty-tag.yaml 2>/tmp/cartforge-prod-empty-tag.err; then
            echo "Expected helm template with empty image.tag to fail" >&2
            exit 1
          fi
          grep -qi 'image.tag' /tmp/cartforge-prod-empty-tag.err

          # Prod without TLS or NetworkPolicy must fail.
          if helm template cartforge helm/cartforge -f helm/cartforge/values-prod.yaml \
              --set image.tag="${{ github.sha }}" --set-json 'ingress.tls=[]' \
              > /tmp/cartforge-prod-no-tls.yaml 2>/tmp/cartforge-prod-no-tls.err; then
            echo "Expected helm template without ingress.tls to fail under prod" >&2
            exit 1
          fi
          grep -qi 'ingress.tls' /tmp/cartforge-prod-no-tls.err

          if helm template cartforge helm/cartforge -f helm/cartforge/values-prod.yaml \
              --set image.tag="${{ github.sha }}" --set networkPolicy.enabled=false \
              > /tmp/cartforge-prod-no-np.yaml 2>/tmp/cartforge-prod-no-np.err; then
            echo "Expected helm template without networkPolicy to fail under prod" >&2
            exit 1
          fi
          grep -qi 'networkPolicy' /tmp/cartforge-prod-no-np.err

          test -s /tmp/cartforge-dev.yaml
          test -s /tmp/cartforge-prod.yaml
          grep -q "image: .*:${{ github.sha }}" /tmp/cartforge-prod.yaml
          grep -q 'kind: NetworkPolicy' /tmp/cartforge-prod.yaml
          grep -q 'secretName: cartforge-api-tls' /tmp/cartforge-prod.yaml
          grep -q 'requirepass' /tmp/cartforge-dev.yaml

          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 - /tmp/cartforge-dev.yaml /tmp/cartforge-prod.yaml <<'PY'
          import sys
          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  docs = [doc for doc in yaml.safe_load_all(handle) if doc]
              if not docs:
                  raise SystemExit(f"{path} rendered no Kubernetes documents")
              print(f"{path}: {len(docs)} documents")
          PY

          grep -q '^kind: Deployment' /tmp/cartforge-dev.yaml
          grep -q '^kind: Deployment' /tmp/cartforge-prod.yaml
          grep -q '^kind: Ingress' /tmp/cartforge-dev.yaml
          grep -q '^kind: Ingress' /tmp/cartforge-prod.yaml

          if helm template cartforge helm/cartforge > /tmp/cartforge-default.yaml 2>/dev/null; then
            echo "Expected default chart values to fail without an environment values file" >&2
            exit 1
          fi
