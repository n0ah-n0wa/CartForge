# CartForge continuous integration
#
# Authoritative Java quality gate: ./mvnw verify
#   compile → unit/integration tests → package → checkstyle → spotbugs
# Infrastructure gates: Docker image build, Helm lint, Helm template

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  HELM_VERSION: v3.16.4
  IMAGE_NAME: cartforge-api

jobs:
  java-verify:
    name: Java verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Confirm toolchain
        run: |
          set -euo pipefail
          java -version
          chmod +x mvnw
          ./mvnw -B -version

      - name: Confirm Docker for Testcontainers
        run: |
          set -euo pipefail
          docker version
          docker info

      - name: Compile
        run: ./mvnw -B -DskipTests compile

      - name: Unit and integration tests
        run: ./mvnw -B test

      - name: Static analysis and package
        run: ./mvnw -B verify -DskipTests

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/ecommerce-api-*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  packaging:
    name: Container and chart validation
    needs: java-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Verify JAR artifact
        run: |
          set -euo pipefail
          ls -la target/
          test -n "$(ls target/ecommerce-api-*.jar)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm lint
        run: |
          set -euo pipefail
          helm lint helm/cartforge -f helm/cartforge/values-dev.yaml
          helm lint helm/cartforge -f helm/cartforge/values-prod.yaml

      - name: Helm template validation
        run: |
          set -euo pipefail
          helm template cartforge helm/cartforge -f helm/cartforge/values-dev.yaml > /tmp/cartforge-dev.yaml
          helm template cartforge helm/cartforge -f helm/cartforge/values-prod.yaml \
            --set image.tag="${{ github.sha }}" > /tmp/cartforge-prod.yaml

          test -s /tmp/cartforge-dev.yaml
          test -s /tmp/cartforge-prod.yaml

          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          import sys
          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  docs = [doc for doc in yaml.safe_load_all(handle) if doc]
              if not docs:
                  raise SystemExit(f"{path} rendered no Kubernetes documents")
              print(f"{path}: {len(docs)} documents")

          PY /tmp/cartforge-dev.yaml /tmp/cartforge-prod.yaml

          grep -q '^kind: Deployment' /tmp/cartforge-dev.yaml
          grep -q '^kind: Deployment' /tmp/cartforge-prod.yaml
          grep -q '^kind: Ingress' /tmp/cartforge-dev.yaml
          grep -q '^kind: Ingress' /tmp/cartforge-prod.yaml

          if helm template cartforge helm/cartforge > /tmp/cartforge-default.yaml 2>/dev/null; then
            echo "Expected default chart values to fail without an environment values file" >&2
            exit 1
          fi
