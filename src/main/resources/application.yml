# Shared, profile-neutral settings. No hostnames, credentials, or secrets.
# Connection and secret values are supplied by the environment (see .env.example).
# Activate a profile explicitly: SPRING_PROFILES_ACTIVE=dev|test|prod

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: ecommerce-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ecommerce-db
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL}
      timeout: 250ms
      connect-timeout: 250ms
      repositories:
        enabled: false
  cache:
    type: redis
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
    deserialization:
      use-big-decimal-for-floats: true

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
    prometheus:
      enabled: true
    env:
      enabled: false
      show-values: never
    beans:
      enabled: false
    conditions:
      enabled: false
    configprops:
      enabled: false
    heapdump:
      enabled: false
    logfile:
      enabled: false
    mappings:
      enabled: false
    shutdown:
      enabled: false
    threaddump:
      enabled: false
  health:
    defaults:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true
    # Spring's Redis indicator would mark the process DOWN when Redis is
    # unavailable. Cache and auth rate limiting fail open, so Redis is reported
    # separately without taking the application out of rotation.
    redis:
      enabled: false
    diskspace:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:3600000}
  cors:
    origins: ${CORS_ORIGINS}
  pagination:
    default-page-size: ${APP_PAGINATION_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${APP_PAGINATION_MAX_PAGE_SIZE:100}
  rate-limit:
    auth:
      enabled: ${APP_RATE_LIMIT_AUTH_ENABLED:true}
      limit: ${APP_RATE_LIMIT_AUTH_LIMIT:20}
      window-seconds: ${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} correlationId=%X{correlationId:-} %m%n%wEx"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.example.ecommerce.common.logging.RequestLoggingFilter: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
