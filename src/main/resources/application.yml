# Shared, profile-neutral settings. No hostnames, credentials, or secrets.
# Connection and secret values are supplied by the environment (see .env.example).
# Activate a profile explicitly: SPRING_PROFILES_ACTIVE=dev|test|prod

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: ecommerce-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ecommerce-db
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
  data:
    redis:
      url: ${REDIS_URL}
      repositories:
        enabled: false
  cache:
    type: redis
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
    env:
      show-values: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:3600000}
  cors:
    origins: ${CORS_ORIGINS}
  pagination:
    default-page-size: ${APP_PAGINATION_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${APP_PAGINATION_MAX_PAGE_SIZE:100}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
