# Production. Every connection string, secret, and origin must be provided.
# Development host fallbacks are not used.

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Sized for a small multi-replica API; raise DATABASE_POOL_SIZE with pod count × load.
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:5}
      connection-timeout: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:3000}
      idle-timeout: ${DATABASE_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DATABASE_POOL_LEAK_DETECTION_MS:60000}
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION}
  cors:
    origins: ${CORS_ORIGINS}
  pagination:
    default-page-size: ${APP_PAGINATION_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${APP_PAGINATION_MAX_PAGE_SIZE:100}
  seed:
    enabled: false

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      enabled: true
      show-details: never
      show-components: never
    prometheus:
      enabled: true
    env:
      enabled: false
      show-values: never
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    beans:
      enabled: false
    configprops:
      enabled: false
    mappings:
      enabled: false
    shutdown:
      enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    com.example.ecommerce: INFO
