# Restrict demo data stores to the API pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cartforge-postgres
  namespace: cartforge
  labels:
    app.kubernetes.io/name: cartforge-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cartforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cartforge-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cartforge-api
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cartforge-redis
  namespace: cartforge
  labels:
    app.kubernetes.io/name: cartforge-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: cartforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cartforge-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cartforge-api
      ports:
        - protocol: TCP
          port: 6379
---
# Restrict who may reach the API Service port (8080). Adjust ingress namespace labels
# for your cluster. These manifests target local/demo use with ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cartforge-api
  namespace: cartforge
  labels:
    app.kubernetes.io/name: cartforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cartforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cartforge-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
