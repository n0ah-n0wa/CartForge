{{- /*
Demo Secret template. Values must be supplied at deploy time — never commit real passwords.
REDIS_URL must use the same password as REDIS_PASSWORD (url-encode special characters).
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: cartforge-secrets
  namespace: cartforge
  labels:
    app.kubernetes.io/name: cartforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cartforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARS"
  REDIS_PASSWORD: "REPLACE_WITH_STRONG_REDIS_PASSWORD"
  REDIS_URL: "redis://:REPLACE_WITH_STRONG_REDIS_PASSWORD@cartforge-redis:6379"
