apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartforge-api
  namespace: cartforge
  labels:
    app.kubernetes.io/name: cartforge-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cartforge
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cartforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartforge-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cartforge
    spec:
      serviceAccountName: cartforge-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0-musl
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z cartforge-postgres 5432; do echo waiting for postgres; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: wait-for-redis
          image: busybox:1.37.0-musl
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z cartforge-redis 6379; do echo waiting for redis; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: cartforge-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cartforge-api
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: JWT_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: REDIS_URL
            - name: TMPDIR
              value: /tmp/app
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp/app
      volumes:
        - name: tmp
          emptyDir: {}
