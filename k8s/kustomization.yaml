apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cartforge

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  # Create the Secret out-of-band (see secret.example.yaml). Never commit real credentials.
  - postgres.yaml
  - redis.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Override image repository/tag without editing deployment.yaml:
#   kustomize edit set image cartforge-api=ghcr.io/<owner>/ecommerce-api:<tag>
images:
  - name: cartforge-api
    newName: cartforge-api
    newTag: local

commonLabels:
  app.kubernetes.io/managed-by: kustomize
