# Production-oriented defaults. Supply image tag, hostnames, and secrets at deploy time.
# Example:
#   helm upgrade --install cartforge ./helm/cartforge \
#     -f helm/cartforge/values-prod.yaml \
#     -f values-secrets.yaml \
#     --set image.tag=$GIT_SHA \
#     --set image.repository=ghcr.io/<owner>/ecommerce-api

replicaCount: 2

image:
  repository: ghcr.io/example/ecommerce-api
  # Required at deploy time (CD / helm --set image.tag=<git-sha>). Empty or SNAPSHOT tags fail render.
  tag: ""
  pullPolicy: IfNotPresent

# Restrict API pod ingress to Ingress and metrics scrapers (path-agnostic; Prometheus stays
# app-level permitAll and relies on this NetworkPolicy — required for prod profile).
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.example.com
      paths:
        - path: /api
          pathType: Prefix
  # Required for prod profile. Replace secretName / hosts at deploy time (cert-manager or manual cert).
  tls:
    - secretName: cartforge-api-tls
      hosts:
        - api.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

config:
  springProfilesActive: prod
  loggingLevelRoot: WARN
  corsOrigins: https://shop.example.com

waitForDependencies:
  enabled: false

database:
  url: jdbc:postgresql://postgres.example.com:5432/ecommerce
  host: postgres.example.com
  username: ecommerce

redis:
  # Include AUTH credentials in production Redis URLs (redis://:PASSWORD@host:6379).
  url: redis://:CHANGE_ME@redis.example.com:6379
  host: redis.example.com

# Do not commit production credentials. Create the Secret out-of-band or pass
# values-secrets.yaml (gitignored) / --set-string at deploy time.
# Existing Secret must include POSTGRES_PASSWORD, JWT_SECRET, and REDIS_URL
# (and REDIS_PASSWORD when using chart demo Redis).
secrets:
  create: false
  existingSecret: cartforge-secrets

demoInfrastructure:
  postgres:
    enabled: false
  redis:
    enabled: false
  networkPolicy:
    enabled: false
