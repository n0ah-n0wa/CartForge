{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cartforge.fullname" . }}
  labels:
    {{- include "cartforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cartforge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        {{- fail "networkPolicy.ingressFrom must list allowed peers when networkPolicy.enabled is true" }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
