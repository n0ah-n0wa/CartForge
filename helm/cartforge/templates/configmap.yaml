apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cartforge.fullname" . }}
  labels:
    {{- include "cartforge.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  SERVER_PORT: {{ .Values.service.port | quote }}
  LOGGING_LEVEL_ROOT: {{ .Values.config.loggingLevelRoot | quote }}
  DATABASE_URL: {{ include "cartforge.databaseUrl" . | quote }}
  DATABASE_USERNAME: {{ .Values.database.username | quote }}
  JWT_EXPIRATION: {{ .Values.config.jwtExpiration | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  APP_PAGINATION_DEFAULT_PAGE_SIZE: {{ .Values.config.pagination.defaultPageSize | quote }}
  APP_PAGINATION_MAX_PAGE_SIZE: {{ .Values.config.pagination.maxPageSize | quote }}
  APP_RATE_LIMIT_AUTH_ENABLED: {{ .Values.config.rateLimit.authEnabled | quote }}
  APP_RATE_LIMIT_AUTH_LIMIT: {{ .Values.config.rateLimit.authLimit | quote }}
  APP_RATE_LIMIT_AUTH_WINDOW_SECONDS: {{ .Values.config.rateLimit.authWindowSeconds | quote }}
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}
  {{- range $key, $value := .Values.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
