# Local / demo cluster. Demo in-cluster stores are not production-managed services.
#
# Secrets are not committed. Lint/render with:
#   helm template cartforge ./helm/cartforge -f helm/cartforge/values-dev.yaml \
#     --set-string secrets.postgresPassword='…' \
#     --set-string secrets.jwtSecret='…' \   # ≥ 32 chars
#     --set-string secrets.redisPassword='…'

replicaCount: 2

image:
  repository: cartforge-api
  tag: local
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: cartforge.local
      paths:
        - path: /api
          pathType: Prefix

config:
  springProfilesActive: dev
  loggingLevelRoot: DEBUG
  corsOrigins: http://cartforge.local

waitForDependencies:
  enabled: true

secrets:
  create: true
  existingSecret: ""
  postgresPassword: ""
  jwtSecret: ""
  redisPassword: ""

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - podSelector: {}

demoInfrastructure:
  postgres:
    enabled: true
  redis:
    enabled: true
  networkPolicy:
    enabled: true
