# Source: cartforge/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartforge
  labels:
    helm.sh/chart: cartforge-0.1.0
    app.kubernetes.io/name: cartforge
    app.kubernetes.io/instance: cartforge
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cartforge
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cartforge
      app.kubernetes.io/instance: cartforge
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartforge
        app.kubernetes.io/instance: cartforge
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: cartforge
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37.0-musl
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z cartforge-postgres 5432; do echo waiting for postgres; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: wait-for-redis
          image: busybox:1.37.0-musl
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z cartforge-redis 6379; do echo waiting for redis; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: cartforge-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cartforge
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: JWT_SECRET
            - name: TMPDIR
              value: /tmp/app
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp/app
      volumes:
        - name: tmp
          emptyDir: {}

---
# Source: cartforge/templates/postgres.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartforge-postgres
  labels:
    helm.sh/chart: cartforge-0.1.0
    app.kubernetes.io/name: cartforge
    app.kubernetes.io/instance: cartforge
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cartforge
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cartforge-postgres
      app.kubernetes.io/instance: cartforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartforge-postgres
        app.kubernetes.io/instance: cartforge
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cartforge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ecommerce"
            - name: POSTGRES_USER
              value: "ecommerce"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartforge-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ecommerce
                - -d
                - ecommerce
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - ecommerce
                - -d
                - ecommerce
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cartforge-postgres-data

---
# Source: cartforge/templates/redis.yaml
# Demo in-cluster Redis - not a production-managed cache service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartforge-redis
  labels:
    helm.sh/chart: cartforge-0.1.0
    app.kubernetes.io/name: cartforge
    app.kubernetes.io/instance: cartforge
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cartforge
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cartforge-redis
      app.kubernetes.io/instance: cartforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartforge-redis
        app.kubernetes.io/instance: cartforge
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: cartforge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}

