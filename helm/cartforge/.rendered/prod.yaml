# Source: cartforge/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cartforge
  labels:
    helm.sh/chart: cartforge-0.1.0
    app.kubernetes.io/name: cartforge
    app.kubernetes.io/instance: cartforge
    app.kubernetes.io/version: "0.1.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: cartforge
    app.kubernetes.io/component: api
spec:
  ingressClassName: nginx
  rules:
    - host: "api.example.com"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cartforge
                port:
                  name: http
